<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2022 政見兌現對照｜臺北施政島（非官方整理）</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --ink: #14213d; --ink-soft: #3d4a66; --paper: #fbf8f2; --paper-2: #f2ede3; --line: rgba(20,33,61,.12); }
    @media (prefers-color-scheme: dark) { :root { --ink: #eef2fb; --ink-soft: #b7c1d8; --paper: #121a2e; --paper-2: #1a2440; --line: rgba(238,242,251,.14); } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; font: 14px/1.6 "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--ink); background: transparent; }
    .wrap { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); overflow: hidden; }
    .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--paper-2); font-size: 12.5px; font-weight: 700; }
    .head a { margin-left: auto; color: var(--ink-soft); }
    .mark { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(#f08c3a 0 45%, #20a39e 45%); }
    .pl { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .pl-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; }
    .pl-cat, .pl-conf { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
    .pl-conf { margin-left: auto; border: 1px dashed var(--line); border-radius: 8px; padding: 1px 6px; }
    .pl-quote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line); font-weight: 600; }
    .pl-deadline { margin: 0; font-size: 12.5px; font-weight: 700; }
    .pl-summary { margin: 0; color: var(--ink-soft); }
    details { font-size: 13px; } summary { cursor: pointer; font-weight: 700; } details ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-soft); }
    .pl-crit summary { color: #c8463d; }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; }
    .src { font-size: 12px; text-decoration: none; padding: 3px 8px; border-radius: 8px; background: var(--paper-2); color: var(--ink-soft); }
    .pl-links { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; } .pl-links a { color: var(--ink-soft); } .pl-go { display: none; }
    .foot { padding: 8px 14px 12px; font-size: 11.5px; color: var(--ink-soft); }
    .err { padding: 20px; color: var(--ink-soft); }
  </style>
  <script type="module" src="./embed.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="head"><span class="mark"></span>臺北施政島・2022 政見兌現對照<a id="full" href="/#/pledges" target="_blank" rel="noopener">看全部 ↗</a></div>
    <div id="card"><p class="err">載入中…</p></div>
    <p class="foot" id="foot">非官方整理，與任何候選人或政黨無關。</p>
  </div>
</body>
</html>
