name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04 # 明確指定版本，避免 ubuntu-latest 自動升級時突然壞掉；Playwright 1.61 起支援 26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: chiang-wanan-policy-island
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 部署前檢查：Three.js 打包檔、importmap 版本碼、CSP hash 是否都是最新
      # （避免像 2026-10-23 那次，新程式碼用到舊打包檔沒有的類別，導致 3D 場景無法啟動）
      - name: Check Three.js bundle
        run: |
          npm ci --no-audit --no-fund
          npm run check:three

      # 無頭瀏覽器＋中文字型：給煙霧測試與分享縮圖使用
      - name: Install browser and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npx playwright install --with-deps chromium

      # 真的打開網站：3D 有啟動、主控台沒有錯誤、各檢視都能切換
      - name: Smoke test
        run: npm test

      # 還沒設定金鑰時直接跳過，避免每次 push 都出現失敗紀錄
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 只部署網站本身的檔案，再產生每一條的分享頁與縮圖
      - name: Prepare site
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir dist
          cp -r index.html styles.css editorial.css main.js world.js people.js vignettes.js pledges.js tour.js mayors.js ledger.js extras.js store.js games.js photo.js hunt.js sail.js ao.js embed _headers data vendor assets dist/
          npm run build:share

      # 部署；遇到 Cloudflare API 限流（10429）或暫時故障就等一下再試，最多 5 次（約 10 分鐘）。
      # 專案不存在時才建立，平常不多打一次 API。
      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --branch main --commit-dirty=true 2>&1 | tee deploy.log; then
              grep -q "Deployment complete" deploy.log && exit 0
            fi
            if grep -q "Project not found\|code: 8000007" deploy.log; then
              npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || true
              continue
            fi
            if ! grep -qiE "rate limited|10429|Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout|fetch failed|ECONNRESET|ETIMEDOUT" deploy.log; then
              echo "部署失敗，且不是限流或暫時故障，不再重試"; exit 1
            fi
            wait=$((i * 60)); echo "Cloudflare 限流或暫時故障，${wait} 秒後重試（第 $i 次）"; sleep $wait
          done
          echo "重試 5 次仍失敗"; exit 1
